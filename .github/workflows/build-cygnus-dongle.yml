name: "Build Cygnus Keyboard Dongle"
on:
  push:
  workflow_dispatch:
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["cygnus_dongle dongle_display"]'
      branches: '["zmkfirmware/zmk/v0.3-branch"]'
